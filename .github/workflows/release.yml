# W-SHIP release workflow (Andrew, 2026-10-27).
# Manual: Actions -> Release -> Run workflow, or
#   gh workflow run release.yml -f version=0.69 -f ref=<sha> -f build=338
# Builds <ref>, publishes GitHub Release v<version> (X.Y), appends
# web/releases.json on main, and redeploys Pages. Unsigned for now.
# Artifacts: rpm (system WebKit), AppImage (bundled WebKit), msi. dmg, deb later.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Public version X.Y (e.g. 0.69)"
        required: true
      ref:
        description: "Commit SHA or branch to release"
        required: true
        default: main
      build:
        description: "Build number Z shown in About (e.g. 338). Blank = 0."
        required: false
      notes:
        description: "One-line release notes for releases.json"
        required: false
      draft:
        description: "Create the GitHub Release as a draft (dry run)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - name: Check version
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y"; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: r
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux-rpm:
    needs: prepare
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: dnf install -y git rpm-build
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Fedora packages
        run: dnf install -y $(grep -vE '^[[:space:]]*(#|$)' scripts/fedora-deps.txt) upx ImageMagick
      - name: Build
        run: |
          # Seed PAVILLION_BUILD so make mini's bump lands on Z. Size path
          # (profile mini, raw UI, mini-assets) then UPX the exe into
          # dist/pavillion for the rpm. DLLs/system libs stay untouched.
          b="${{ inputs.build }}"; printf '%s\n' "$(( ${b:-1} - 1 ))" > PAVILLION_BUILD
          make mini
          # rpm installs dist/pavillion; mini wrote dist/pavillion-mini.
          cp -f dist/pavillion-mini dist/pavillion
          dist/pavillion --version
      - name: rpm
        run: |
          rpmbuild -bb packaging/rpm/pavillion.spec \
            --define "_sourcedir $PWD" --define "_rpmdir $PWD/out" \
            --define "_build_name_fmt %%{NAME}-%%{VERSION}-%%{RELEASE}.%%{ARCH}.rpm" \
            --define "pav_version ${{ inputs.version }}"
          mkdir -p assets && mv out/*.rpm assets/
          cd assets && for f in *; do sha256sum "$f" > "$f.sha256"; done
          rpm -qpR *.rpm
      - uses: actions/upload-artifact@v6
        with:
          name: asset-linux-rpm
          path: assets/*

  linux-appimage:
    # Portable AppImage: bundles WebKitGTK and every library (W-SHIP). Built on
    # the oldest supported Ubuntu so its glibc floor runs on most distros.
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config file curl wget \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libjansson-dev libcurl4-openssl-dev libsqlite3-dev libsecret-1-dev \
            uuid-dev libgmime-3.0-dev libical-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: |
          printf '%s\n' "${{ inputs.build || '0' }}" > PAVILLION_BUILD
          make lib
          (cd ui && npm install)
          # Size profile, unpacked: linuxdeploy patches the binary, so no UPX here.
          PAVILLION_CMAKE_DIR=build-mini PAVILLION_SIZE=1 \
            ./ui/node_modules/.bin/tauri build --no-bundle \
              --config src-tauri/tauri.mini.conf.json \
              -- --profile mini --no-default-features
          strip --strip-unneeded src-tauri/target/mini/pavillion
          PAVILLION_VERSION=${{ inputs.version }} \
            bash packaging/linux/appimage.sh src-tauri/target/mini/pavillion
          dist/Pavillion-${{ inputs.version }}-x86_64.AppImage --version
      - name: Collect
        run: |
          mkdir -p assets
          cp dist/Pavillion-${{ inputs.version }}-x86_64.AppImage assets/
          cd assets && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v6
        with:
          name: asset-linux-appimage
          path: assets/*

  windows-msi:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-jansson
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gmime
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-upx
      - name: Build msi
        env:
          CMAKE_GENERATOR: MSYS Makefiles
          CFLAGS: -I/ucrt64/include
          LDFLAGS: -L/ucrt64/lib -lws2_32
          # Size flags like make mini, minus force-unwind-tables=no —
          # Windows gnu targets require unwind tables (rustc aborts).
          RUSTFLAGS: -C link-arg=-Wl,--gc-sections -C link-arg=-Wl,--as-needed -C link-arg=-Wl,-O1
        run: |
          printf '%s\n' "${{ inputs.build || '0' }}" > PAVILLION_BUILD
          make lib
          (cd ui && npm install)
          # Size path: profile mini, raw UI (no tauri compression), shrink
          # mark.png. Then collect MinGW DLLs from the unpacked exe, UPX
          # only pavillion.exe, and MSI-bundle with DLLs as resources.
          PAVILLION_CMAKE_DIR=build-mini PAVILLION_SIZE=1 \
            ./ui/node_modules/.bin/tauri build --no-bundle \
              --config src-tauri/tauri.mini.conf.json \
              -- --profile mini --no-default-features
          # Bundle looks under target/release/; mini wrote target/mini/.
          EXE_MINI=src-tauri/target/mini/pavillion.exe
          packaging/windows/collect-dlls.sh "$EXE_MINI" src-tauri/windows-dlls
          # tauri-build drops WebView2Loader.dll next to the profile exe; it is
          # not a MinGW import so collect-dlls misses it. Ship it beside the
          # installed exe (windows-dlls → ./) and next to the bundle input.
          WV2="${EXE_MINI%/*}/WebView2Loader.dll"
          if [ ! -f "$WV2" ]; then
            echo "WebView2Loader.dll missing next to $EXE_MINI" >&2
            exit 1
          fi
          cp -f "$WV2" src-tauri/windows-dlls/WebView2Loader.dll
          cp LICENSE.md THIRD_PARTY.md src-tauri/windows-dlls/
          strip --strip-unneeded "$EXE_MINI" || true
          upx --best --lzma -q "$EXE_MINI"
          upx -t -q "$EXE_MINI"
          mkdir -p src-tauri/target/release
          cp -f "$EXE_MINI" src-tauri/target/release/pavillion.exe
          cp -f "$WV2" src-tauri/target/release/WebView2Loader.dll
          ./ui/node_modules/.bin/tauri bundle --bundles msi \
            --config '{"bundle":{"active":true,"targets":["msi"],"resources":{"windows-dlls/":"./"}}}'
      - name: Collect
        run: |
          mkdir -p assets
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "assets/Pavillion-${{ inputs.version }}-x86_64.msi"
          done
          cd assets && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v6
        with:
          name: asset-windows-msi
          path: assets/*

  publish:
    needs: [prepare, linux-rpm, linux-appimage, windows-msi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ inputs.version }}"
          if ! gh release view "$v" >/dev/null 2>&1; then
            gh release create "$v" --target "${{ needs.prepare.outputs.sha }}" \
              --title "Pavillion ${{ inputs.version }}" \
              --notes "${{ inputs.notes || 'Unsigned build.' }}" \
              ${{ inputs.draft && '--draft' || '' }}
          fi
          gh release upload "$v" assets/* --clobber
      - name: releases.json
        if: ${{ !inputs.draft }}
        run: |
          b="${{ inputs.version }}.${{ inputs.build || '0' }}"
          bash scripts/release-json.sh "${{ inputs.version }}" \
            "${{ needs.prepare.outputs.sha }}" "$b" assets "${{ inputs.notes }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/releases.json
          git commit -m "Release ${{ inputs.version }} (web/releases.json)"
          # main.yml (cloc) may push README.md meanwhile: retry with rebase.
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  pages:
    needs: publish
    if: ${{ !inputs.draft }}
    uses: ./.github/workflows/static.yml
