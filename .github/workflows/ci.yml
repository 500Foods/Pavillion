# W-1. The fedora job is the CI Lock. G-1 adds the macos-core job; windows-core
# mirrors it (W Lock, 2026-10-19).
# main.yml is the line-count workflow and stays as it is.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v5

      - name: Install Fedora packages
        run: |
          dnf install -y $(grep -vE '^[[:space:]]*(#|$)' scripts/fedora-deps.txt)

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-fedora-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-fedora-

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-fedora-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-fedora-

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Upload pavillion
        uses: actions/upload-artifact@v6
        with:
          name: pavillion-${{ github.sha }}
          path: dist/pavillion

  # G-1. Core and Unity only, on the fake platform. No window. Required
  # (Andrew, 2026-10-20): every push keeps all three jobs green; a platform
  # break is fixed in the same round, never deferred.
  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install core libraries
        run: brew install jansson sqlite cmake socat jq gmime

      - name: Test
        run: |
          prefix="$(brew --prefix)"
          export PKG_CONFIG_PATH="${prefix}/lib/pkgconfig:$(brew --prefix gmime)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make test CFLAGS="-I${prefix}/include" LDFLAGS="-L${prefix}/lib -lcurl"

  # Core and Unity only, like macos-core, under MSYS2 UCRT64. No window.
  # MinGW is the Windows toolchain (G-Q4, 2026-10-19). Required like macos-core (2026-10-20).
  # path-type inherit keeps the runner's Node on PATH for the Vitest half of make test.
  windows-core:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          # cache defaults on; keep it explicit. Skip pacman -Syu so setup
          # reuses the cached package set instead of spending ~1–1.5 min
          # updating every run (setup-msys2 README: update default is false).
          cache: true
          update: false
          install: >-
            make
            socat
            openssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-jansson
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gmime
            mingw-w64-ucrt-x86_64-jq

      - name: Test
        env:
          CMAKE_GENERATOR: MSYS Makefiles
        run: |
          # The Unity tests use /tmp paths; a native exe reads that as <drive>:\tmp.
          mkdir -p "/$(pwd -W | cut -c1 | tr "[:upper:]" "[:lower:]")/tmp"
          make test CFLAGS="-I/ucrt64/include" LDFLAGS="-L/ucrt64/lib -lws2_32"
