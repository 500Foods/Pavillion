# Stalward test configuration for Pavillion fixture.
# Serves JMAP, IMAP, and SMTP for test-a.local and test-b.local.
# Pinned to stalwartlabs/stalwart:v0.16.26.

[server]
hostname = "localhost"

[network.tls]
enabled = true
certificate = "/etc/stalwart/tls/test-ca.crt"
key = "/etc/stalwart/tls/test-ca.key"

[auth]
type = "plain"
[auth.plain]
users = [
    { username = "andrew@test-a.local", password = "test" },
    { username = "alice@test-a.local", password = "test" },
    { username = "bob@test-b.local", password = "test" },
    { username = "carol@test-b.local", password = "test" },
    { username = "dave@test-b.local", password = "test" },
]

[jmap]
enabled = true

[imap]
enabled = true

[smtp]
enabled = true

[database]
type = "sled"
path = "/var/lib/stalwart/data"

[logging]
level = "debug"
