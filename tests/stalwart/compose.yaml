# Stalwart test container for Pavillion.
# Pinned to stalwartlabs/stalwart:v0.16.26. v0.16 reads only config.json (the
# datastore); domains, accounts, and the certificate are seeded through the
# admin API by seed.sh. Run through the Makefile (it-up, it-seed, it-down).
services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.26
    container_name: pavillion-stalwart
    user: "${PAV_UID:-2000}:${PAV_GID:-2000}"
    ports:
      - "1443:443"
      - "1993:993"
      - "1465:465"
    volumes:
      - ./config.json:/etc/stalwart/config.json:ro
      - ../../build/stalwart-tls:/etc/stalwart/tls:ro
      - ../../build/stalwart-data:/var/lib/stalwart
    environment:
      - STALWART_RECOVERY_ADMIN=admin:${PAV_STALWART_ADMIN_PW:?set PAV_STALWART_ADMIN_PW}
      - STALWART_PUBLIC_URL=https://localhost:1443
