<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pavillion</title>
    <link rel="stylesheet" href="/styles/dark.css" />
    <link rel="stylesheet" href="/styles/light.css" />
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/widgets.css" />
    <link rel="stylesheet" href="/styles/tree.css" />
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }

      html {
        color-scheme: dark;
        background: #000;
        --pav-surface-canvas: #000;
        --pav-text: #e8e8e8;
        --pav-font: "Vanadium Sans", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <p>Pavillion</p>
    </div>
    <div id="app"></div>
    <script>
      /* The stylesheets above have loaded: a classic script waits for them.
         Tell the shell the cover is laid out. The window stays hidden until
         then, so the first frame is this cover. A hidden WebKit view may not
         run animation frames, so the timer is the signal in that case. */
      (function () {
        var sent = false;
        function reveal() {
          if (sent) {
            return;
          }
          var internals = window.__TAURI_INTERNALS__;
          if (!internals || typeof internals.invoke !== "function") {
            return;
          }
          sent = true;
          internals.invoke("plugin:event|emit", {
            event: "pav-splash-painted",
            payload: {},
          });
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(reveal);
        });
        setTimeout(reveal, 32);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
