[package]
name = "pavillion"
# Phase stamp 0.<completed plan steps>.0. The last component stays 0. PAVILLION_BUILD is the build count.
version = "0.50.0"
description = "Pavillion"
edition = "2024"

[lib]
name = "pavillion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["compression"]
# `make build` keeps this. `make mini` passes `--no-default-features` so the
# page is stored raw and UPX can compress it. Tauri's own default features
# are listed below; compression is the only one that switches.
compression = ["tauri/compression"]

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "wry",
    "common-controls-v6",
    "dynamic-acl",
    "x11",
    "dbus",
    "devtools",
] }
tauri-plugin-dialog = "2"
libc = "0.2"
pav_stronghold = { path = "../core/platform/stronghold" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `make mini` only. `make build` stays on release above.
[profile.mini]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
