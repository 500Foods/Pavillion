[package]
name = "pavillion"
# Phase stamp 0.<Done rows>.0: the stamp is the number of Done rows in the Implementation sequence; marking a row Done moves it. The last component stays 0. PAVILLION_BUILD is the build count.
version = "0.69.0"
description = "Pavillion"
edition = "2024"

[lib]
name = "pavillion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["compression"]
# `make build` keeps this. `make mini` passes `--no-default-features` so the
# page is stored raw and UPX can compress it. Tauri's own default features
# are listed below; compression is the only one that switches.
compression = ["tauri/compression"]

[target.'cfg(target_os = "linux")'.dependencies]
# Native start splash (src/splash.rs). Already linked by Tauri on Linux.
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
# Native start splash (src/splash.rs). Both already in the tree via Tauri.
png = "0.18"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native start splash (src/splash.rs). Already in the tree via Tauri.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSBox", "NSColor", "NSImage", "NSImageView", "NSControl", "NSView", "NSResponder", "NSWindow", "NSGraphics"] }

[dependencies]
zeroize = "1"
tauri = { version = "2", default-features = false, features = [
    "wry",
    "common-controls-v6",
    "dynamic-acl",
    "x11",
    "dbus",
    "devtools",
] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5"
sha2 = "0.10"
libc = "0.2"
pav_stronghold = { path = "../core/platform/stronghold" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `make mini` only. `make build` stays on release above.
[profile.mini]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
